spring.datasource.url=jdbc:h2:mem:departamento_pessoal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
app.security.jwt.issuer=departamento-pessoal-test
app.security.jwt.token-validity=PT1H
app.cors.allowed-origin=http://localhost:3000
app.bootstrap-demo-data=false
